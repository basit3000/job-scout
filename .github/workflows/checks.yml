name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CI: 'true'
      NO_OPEN: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:activity
      - run: npm run test:improvements
      - run: npm run benchmark
      - run: npm run privacy
      - run: npm run privacy -- --staged
      - name: Explain intentionally excluded integrations
        run: node -e "console.log('Offline fixtures only. No live portals, provider credentials, paid searches, Gmail, webhooks or Overleaf publication. Windows installer tests intentionally skip on Linux. Chrome must be present on the hosted runner.');"
